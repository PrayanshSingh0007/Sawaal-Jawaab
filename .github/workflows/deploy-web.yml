# Publishes frontend/ to GitHub Pages.
#
# This is the page the QR code opens — the person replying is a stranger at a
# counter, so it has to be a plain web page that works in seconds with no app
# and no account. It needs to exist at a real, stable URL for the code on the
# asker's screen to mean anything.
name: Deploy reply page

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          # Optional. With them, a reply can travel back from another phone;
          # without them the build still works and the page says so plainly.
          # The anon key is a public value by design — it ships inside the
          # bundle either way — so this is about keeping it out of the repo and
          # making it rotatable, not about hiding it.
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
